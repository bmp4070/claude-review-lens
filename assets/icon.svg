<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D97757"/>
      <stop offset="100%" style="stop-color:#C45A3B"/>
    </linearGradient>
    <linearGradient id="comment-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bg-grad)"/>

  <!-- Comment bubble -->
  <path d="M32 40 h64 a8 8 0 0 1 8 8 v36 a8 8 0 0 1 -8 8 h-40 l-16 16 v-16 h-8 a8 8 0 0 1 -8 -8 v-36 a8 8 0 0 1 8 -8z"
        fill="url(#comment-grad)" opacity="0.95"/>

  <!-- Code lines in comment -->
  <rect x="40" y="52" width="32" height="4" rx="2" fill="#D97757"/>
  <rect x="40" y="62" width="48" height="4" rx="2" fill="#D97757" opacity="0.7"/>
  <rect x="40" y="72" width="24" height="4" rx="2" fill="#D97757" opacity="0.5"/>

  <!-- Checkmark accent -->
  <circle cx="96" cy="88" r="16" fill="#22c55e"/>
  <path d="M88 88 l5 5 l11 -11" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
